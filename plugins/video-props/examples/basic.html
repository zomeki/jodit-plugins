<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../node_modules/jodit/es2021/jodit.min.css">
  <link rel="stylesheet" href="../dist/index.css">
  <script type="importmap">
    {
      "imports": {
        "jodit": "../node_modules/jodit/esm/index.js",
        "jodit/plugins/all": "../node_modules/jodit/esm/plugins/all.js",
        "jodit-plugin-video-props": "../dist/index.module.mjs"
      }
    }
  </script>
  <script type="module">
    import { Jodit } from 'jodit';
    import 'jodit/plugins/all';
    import 'jodit-plugin-video-props';

    document.addEventListener('DOMContentLoaded', () => {
      const jodit = Jodit.make('#editor', {
        buttons: ['source'],
        sourceEditor: 'area',
        cleanHTML: {
          denyTags: 'script,object,embed' // allow iframe
        }
      });
    });
  </script>
</head>
<body>
  <h1>Basic use</h1>
  <textarea id="editor">
    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" controls width="320" height="180" title="Sample video" ></video>
    <audio src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" controls title="Sample audio"></audio>
    <iframe src="/examples/index.html" width="320" height="180" title="Sample iframe"></iframe>
  </textarea>
</body>
</html>
